<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Stats Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Golf Stats Tracker</h1>
    <form id="golfForm">
        <h2>Enter Your Stats for Each Hole</h2>

        <!-- Hole Information -->
        <label for="hole">Hole Number:</label>
        <input type="number" id="hole" min="1" max="18" required>

        <!-- Distance -->
        <label for="drive">Drive Distance (yards):</label>
        <input type="number" id="drive" required>

        <!-- Approach -->
        <label for="iron">Iron Proximity to Hole (yards):</label>
        <input type="number" id="iron" required>

        <!-- Putt Information -->
        <label for="putts">Number of Putts:</label>
        <input type="number" id="putts" required>

        <label for="puttLength">Putt Length (feet):</label>
        <input type="number" id="puttLength" required>

        <button type="submit">Calculate Strokes Gained</button>
    </form>

    <h2>Strokes Gained Results</h2>
    <div id="results"></div>

    <script src="app.js"></script>
</body>
</html>
